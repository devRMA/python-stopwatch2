name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: pypi
      url: https://pypi.org/p/python-stopwatch2

    permissions:
      contents: read
      # Required by PyPI Trusted Publishing (OIDC) and PEP 740 attestations.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Assert tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(poetry version --short)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag '$tag' does not match project version '$pkg'"
            exit 1
          fi

      - name: Build distributions
        run: poetry build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
